version: '3.8'

services:
  # 1. PostgreSQL Database (Stores User sessions, Video Metadata, Job statuses)
  postgres:
    image: postgres:15-alpine
    container_name: streamify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamify
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run SQL schema script on startup
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamify"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue (Broker for Asynq task dispatcher and WebSocket status pubsub)
  redis:
    image: redis:7-alpine
    container_name: streamify-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO Object Storage (Self-hosted S3-compatible service for raw video files + segmented HLS variants)
  minio:
    image: minio/minio:latest
    container_name: streamify-minio
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Web Console UI port
    entrypoint: sh
    command: -c "minio server /data --console-address :9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
