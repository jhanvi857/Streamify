version: '3.8'

services:
  # 1. PostgreSQL Database (Stores User sessions, Video Metadata, Job statuses)
  postgres:
    image: postgres:15-alpine
    container_name: streamify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamify
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run SQL schema script on startup
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamify"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue (Broker for Asynq task dispatcher and WebSocket status pubsub)
  redis:
    image: redis:7-alpine
    container_name: streamify-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. CloudWeave Object Storage (S3-compatible distributed store)
  cloudweave:
    image: ghcr.io/jhanvi857/cloudweave:latest
    container_name: streamify-cloudweave
    ports:
      - "9000:9000"
    environment:
      - CLOUDWEAVE_API_KEYS=cw_key_streamify=admin,master-secret-key=admin
    volumes:
      - cloudweave_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  cloudweave_data:

